<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}infra{% endblock %}</title>
  <link rel="preload" href="/static/fonts/ibm-plex-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="icon" href="/static/icon/icon.svg" type="image/svg+xml">
  <link rel="icon" href="/static/icon/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/static/icon/apple-touch-icon.png">
  <meta name="theme-color" content="#2f6b5e">
  <link rel="stylesheet" href="/static/site.css">
</head>
<body class="{% block body_class %}inner{% endblock %} art-{% block art %}tools{% endblock %}">
  <div class="scene">
    <header class="site">
      <a class="brand" href="/" aria-label="infra, home">
        <svg class="mark" viewBox="0 0 32 32" width="26" height="26" aria-hidden="true">
          <rect width="32" height="32" rx="8" fill="#2f6b5e"/>
          <path d="M8.5 19.5a7.5 7.5 0 0 1 15 0z" fill="#f2b84b"/>
          <path d="M6 19.5h20" stroke="#f7f6f2" stroke-width="2" stroke-linecap="round"/>
          <path d="M9 23.5h5M17 23.5h6" stroke="#f7f6f2" stroke-width="2" stroke-linecap="round" opacity=".7"/>
        </svg>
        infra
      </a>
      <nav>
        <a href="/labs">Labs</a>
        <a href="/writing">Writing</a>
        <a href="/members">Members</a>
        {% if member %}
          <span class="sep" aria-hidden="true"></span>
          <a href="/write">New post</a>
          <a href="/me/posts">My posts</a>
          <a href="/u/{{ member.github_login }}">Profile</a>
          {% if member.is_admin %}<a href="/admin/members">Admin</a>{% endif %}
          <form method="post" action="/auth/logout"><button class="link">Sign out</button></form>
        {% else %}
          <a class="cta" href="/auth/github/login">Sign in with GitHub</a>
        {% endif %}
      </nav>
    </header>
    {% block scene %}{% endblock %}
  </div>
  {% block main %}
  <main class="sheet {% block sheet_class %}{% endblock %}">
    {% block content %}{% endblock %}
  </main>
  {% endblock %}
  <footer class="site">infra · Deerwalk Institute of Technology</footer>
</body>
</html>

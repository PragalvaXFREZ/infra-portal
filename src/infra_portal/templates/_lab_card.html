<a class="lab-card" href="{{ lab.url }}">
  {% if lab.visibility_label %}<span class="visibility">{{ lab.visibility_label }}</span>{% endif %}
  <strong>{{ lab.title }}</strong>
  <span class="summary">{{ lab.summary }}</span>
  <span class="foot">{{ lab.kind_label }} · <time datetime="{{ lab.date.isoformat() }}">{{ lab.date.strftime("%-d %B %Y") }}</time></span>
</a>

<article class="item">
  <a class="title" href="{{ post.url }}">{{ post.title }}</a>
  <div class="meta">
    <a href="/u/{{ post.author.github_login }}">{{ post.author.name }}</a>
    {% if post.published_at %} · <time datetime="{{ post.published_at.isoformat() }}">{{ post.published_at.strftime("%Y-%m-%d") }}</time>{% endif %}
  </div>
</article>

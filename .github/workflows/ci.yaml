name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/pragalvaxfrez/infra-portal

jobs:
  test:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - run: uv run pytest -q

  compose:
    name: compose stack starts healthy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start api and db
        run: |
          cp .env.example .env
          docker compose up --build --wait --wait-timeout 120
      - name: Probe health endpoints
        run: |
          curl --fail --silent --show-error localhost:8000/livez
          curl --fail --silent --show-error localhost:8000/readyz
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes

  image:
    name: build image (push on main)
    needs: [test, compose]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags: sha-<short commit> on every build, and "main" for the default branch.
      # Deployments pin the digest, never a moving tag.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=short
            type=ref,event=branch

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Write the pinned image reference to the summary
        if: github.event_name != 'pull_request'
        run: |
          short="${GITHUB_SHA::7}"
          ref="${IMAGE}:sha-${short}@${{ steps.build.outputs.digest }}"
          {
            echo "### Image"
            echo
            echo "Pin this reference in the lab repository:"
            echo
            echo '```'
            echo "$ref"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
